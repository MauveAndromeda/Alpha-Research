name: Research Validation Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  pit-audit:
    name: Point-in-Time Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run PIT Audit
        run: python scripts/audit_pit.py
        continue-on-error: false

      - name: Upload PIT Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit-audit-report
          path: artifacts/pit_audits/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --cov=src/alpha_research --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  validation-check:
    name: Validation System Check
    runs-on: ubuntu-latest
    needs: [pit-audit, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Check module registration
        run: |
          echo "Checking if core modules are registered..."
          python -c "
          from pathlib import Path
          registry = Path('artifacts/module_registry')
          if not registry.exists() or not list(registry.glob('*.json')):
              print('WARNING: No modules registered. Run scripts/register_core_modules.py')
          else:
              print(f'Found {len(list(registry.glob(\"*.json\")))} registered modules')
          "

      - name: Validate frozen config
        run: |
          echo "Checking frozen config..."
          if [ -f "config/frozen_v1.yaml" ]; then
            echo "Frozen config exists"
          else
            echo "WARNING: No frozen config found"
          fi

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install ruff mypy

      - name: Run ruff
        run: ruff check src/ --ignore E501
        continue-on-error: true

      - name: Run mypy
        run: mypy src/alpha_research --ignore-missing-imports
        continue-on-error: true
